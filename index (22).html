<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>المنصة الإدارية المتكاملة | جامعة جدة</title>
    <!-- المكتبات -->
    <script src="cloud-integration.js"></script>
<script src="cloud-sync-enhanced.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", "Cairo", Tahoma, sans-serif;
        background: #f5f7fa;
      }
      :root {
        --uj-navy: #002b49;
        --uj-gold: #c5a059;
        --uj-shadow: 0 12px 25px -8px rgba(0, 0, 0, 0.1);
        --uj-border-radius: 20px;
      }
      .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(145deg, #001f34, #002b49);
        position: fixed;
        inset: 0;
        z-index: 2000;
      }
      .login-card {
        background: white;
        padding: 2rem;
        border-radius: 32px;
        width: 480px;
        text-align: center;
        box-shadow: 0 30px 45px rgba(0, 0, 0, 0.25);
        border-top: 6px solid var(--uj-gold);
      }
      .login-card h2 {
        color: var(--uj-navy);
        font-size: 28px;
        margin-bottom: 5px;
      }
      .login-card .dept-name {
        color: var(--uj-gold);
        font-weight: 600;
        margin-bottom: 15px;
        border-bottom: 1px dashed #e2e8f0;
        display: inline-block;
        padding-bottom: 5px;
      }
      .login-input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 40px;
        border: 1px solid #cbd5e1;
        text-align: right;
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background: var(--uj-navy);
        color: white;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }
      .login-btn:hover {
        background: var(--uj-gold);
        color: var(--uj-navy);
        transform: translateY(-2px);
      }
      .platform {
        display: none;
        direction: rtl;
      }
      .sidebar {
        position: fixed;
        right: 0;
        top: 0;
        width: 300px;
        height: 100%;
        background: linear-gradient(180deg, #002b49, #001f34);
        color: white;
        padding: 20px;
        overflow-y: auto;
        box-shadow: -5px 0 20px rgba(0, 0, 0, 0.2);
        z-index: 100;
      }
      .sidebar h3 {
        color: var(--uj-gold);
        text-align: center;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .user-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 12px;
        margin-bottom: 20px;
        border-right: 4px solid var(--uj-gold);
      }
      .menu-btn {
        display: block;
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        background: rgba(255, 255, 255, 0.05);
        border: none;
        color: #e2e8f0;
        text-align: right;
        border-radius: 40px;
        cursor: pointer;
        transition: 0.2s;
      }
      .menu-btn:hover {
        background: rgba(197, 160, 89, 0.2);
        transform: translateX(-3px);
      }
      .menu-btn.active {
        background: var(--uj-gold);
        color: var(--uj-navy);
        font-weight: bold;
      }
      .logout-btn {
        background: rgba(220, 38, 38, 0.8);
        margin-top: 30px;
      }
      .main {
        margin-right: 310px;
        padding: 25px;
      }
      .notes-widget {
        background: white;
        border-radius: 24px;
        padding: 12px 20px;
        margin-bottom: 25px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        box-shadow: var(--uj-shadow);
        border-right: 6px solid var(--uj-gold);
      }
      .panel {
        background: white;
        border-radius: var(--uj-border-radius);
        padding: 24px;
        margin-bottom: 28px;
        box-shadow: var(--uj-shadow);
        display: none;
      }
      .panel.active {
        display: block;
        animation: fadeIn 0.3s;
      }
      <button class="menu-btn" onclick="openCloudConnectModal()">☁️ اتصال السحابة</button>
<button class="menu-btn" onclick="syncNowWithCloud()">🔄 مزامنة سريعة</button>
<button class="menu-btn" onclick="exportSessionToCloud()">💾 نسخ احتياطي</button>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .stats-row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .stat-card {
        background: #f8fafe;
        border-radius: 20px;
        padding: 12px 20px;
        border-right: 4px solid var(--uj-gold);
        font-weight: 600;
        color: var(--uj-navy);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
        font-size: 13px;
      }
      th,
      td {
        border: 1px solid #e2e8f0;
        padding: 10px;
        text-align: right;
      }
      th {
        background: var(--uj-navy);
        color: white;
      }
      .btn-primary {
        background: var(--uj-navy);
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 40px;
        cursor: pointer;
        margin: 2px;
        transition: 0.2s;
      }
      .btn-primary:hover {
        background: var(--uj-gold);
        color: var(--uj-navy);
        transform: translateY(-2px);
      }
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
        align-items: center;
      }
      .filter-bar input,
      .filter-bar select {
        padding: 6px 12px;
        border-radius: 40px;
        border: 1px solid #cbd5e1;
      }
      .pagination {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-top: 20px;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 43, 73, 0.7);
        backdrop-filter: blur(4px);
        justify-content: center;
        align-items: center;
        z-index: 3000;
      }
      .modal-content {
        background: white;
        width: 850px;
        max-width: 90%;
        border-radius: 32px;
        padding: 24px;
        max-height: 85vh;
        overflow-y: auto;
        border-top: 6px solid var(--uj-gold);
      }
      .tag {
        display: inline-block;
        background: #eff6ff;
        color: var(--uj-navy);
        padding: 2px 10px;
        border-radius: 40px;
        font-size: 11px;
        margin: 2px;
      }
      .file-icon {
        font-size: 1.2rem;
        margin-left: 4px;
      }
      .sync-status {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 10px;
      }
      .sync-success {
        background: #dcfce7;
        color: #166534;
      }
      .sync-pending {
        background: #fed7aa;
        color: #9a3412;
      }
      .file-preview {
        max-width: 100%;
        max-height: 400px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 12px;
      }
      .preview-container {
        background: #f9f9f9;
        padding: 15px;
        border-radius: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loginScreen" class="login-container">
      <div class="login-card">
        <h2>المنصة الإدارية</h2>
        <div class="dept-name">إدارة المنح الدراسية والتبادل الطلابي | جامعة جدة</div>
        <input type="email" id="emailLogin" placeholder="البريد المؤسسي @uj.edu.sa" class="login-input" />
        <button class="login-btn" onclick="doLogin()">دخول</button>
        <div id="loginError" class="error-msg"></div>
      </div>
    </div>
    <div id="platformApp" class="platform">
      <div class="sidebar">
        <h3>⚙️ المنصة الإدارية</h3>
        <div class="user-card">
          مرحباً:
          <strong id="userName"></strong>
          <br />
          <span id="userRoleText">مدير النظام</span>
        </div>
        <button class="menu-btn active" onclick="showPanel('dashboardPanel')">📊 لوحة التحكم</button>
        <button class="menu-btn" onclick="showPanel('browserPanel')">📁 مستعرض الملفات</button>
        <button class="menu-btn" onclick="showPanel('proceduresPanel')">📂 الأدلة الإجرائية</button>
        <button class="menu-btn" onclick="showPanel('operationalGuidesPanel')">📘 الأدلة التشغيلية</button>
        <button class="menu-btn" onclick="showPanel('tasksPanel')">✅ المهام المسندة</button>
        <button class="menu-btn" onclick="showPanel('adminOrdersPanel')">📜 التكاليف الإدارية</button>
        <button class="menu-btn" onclick="showPanel('smartSearchPanel')">🔍 بحث ذكي متقدم</button>
        <button class="menu-btn" onclick="showPanel('cloudSettingsPanel')">☁️ إعدادات السحابة</button>
        <button class="menu-btn logout-btn" onclick="logout()">🚪 خروج</button>
      </div>
      <div class="main">
        <div class="notes-widget">
          <span>📝 ملاحظة للمستخدمين:</span>
          <textarea id="noteText" rows="1" placeholder="اترك ملاحظة..."></textarea>
          <button class="btn-primary" onclick="saveNote()">حفظ</button>
          <div id="lastNoteDisplay" style="flex: 1; font-size: 12px"></div>
        </div>

        <div id="dashboardPanel" class="panel active">
          <h3>لوحة التحكم الإحصائية</h3>
          <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px">
            <div style="flex: 1; min-width: 250px"><canvas id="weeklyDocsChart"></canvas></div>
            <div style="flex: 1; min-width: 250px"><canvas id="tasksStatusChart"></canvas></div>
            <div style="flex: 1; min-width: 250px"><canvas id="fileTypesChart"></canvas></div>
          </div>
          <div class="stats-row" id="liveStatsDashboard"></div>
        </div>

        <div id="browserPanel" class="panel">
          <h3>📁 مستعرض الملفات</h3>
          <div id="browserFilters" class="filter-bar"></div>
          <button class="btn-primary" onclick="openAddDocumentModal()">➕ إضافة مستند جديد</button>
          <div id="browserTable"></div>
          <div id="browserPagination"></div>
        </div>
        <div id="proceduresPanel" class="panel">
          <h3>📂 الأدلة الإجرائية</h3>
          <div class="filter-bar" id="procFilters"></div>
          <button class="btn-primary" onclick="openAddProcedureModal()">➕ إضافة دليل إجرائي</button>
          <div id="procTable"></div>
          <div id="procPagination"></div>
          <div
            id="recommendationsBox"

          ></div>
        </div>
        <div id="operationalGuidesPanel" class="panel">

          <button class="btn-primary" onclick="openAddOperationalGuideModal()">➕ إضافة دليل تشغيلي</button>
          <div id="opGuideTable"></div>
          <div id="opGuidePagination"></div>
        </div>
        <div id="tasksPanel" class="panel">
          <h3>✅ المهام المسندة</h3>
          <div class="filter-bar" id="taskFilters"></div>
          <button class="btn-primary" onclick="openAddTaskModal()">➕ إسناد مهمة جديدة</button>
          <div id="taskTable"></div>
          <div id="taskPagination"></div>
        </div>
        <div id="adminOrdersPanel" class="panel">
          <h3>📜 التكاليف الإدارية</h3>
          <div class="filter-bar" id="orderFilters"></div>
          <button class="btn-primary" onclick="openAddAdminOrderModal()">➕ تكليف إداري جديد</button>
          <div id="orderTable"></div>
          <div id="orderPagination"></div>
        </div>
        <div id="smartSearchPanel" class="panel">
          <h3>🔍 البحث الذكي المتقدم</h3>
          <div style="display: flex; gap: 10px; margin-bottom: 20px">
            <input
              type="text"
              id="smartQuery"
              style="flex: 2; padding: 10px; border-radius: 40px"
              placeholder="كلمة البحث..."
            />
            <select id="smartTypeFilter">
              <option value="">جميع الأنواع</option>
              <option value="document">مستندات</option>
              <option value="procedure">أدلة إجرائية</option>
              <option value="opGuide">أدلة تشغيلية</option>
              <option value="task">مهام</option>
              <option value="order">تكاليف إدارية</option>
            </select>
            <button class="btn-primary" onclick="runSmartSearch()">بحث</button>
          </div>
          <div id="smartResults"></div>
        </div>
        <div id="cloudSettingsPanel" class="panel">
          <h3>☁️ إعدادات السحابة</h3>
          <input type="text" id="cloudBaseUrl" style="width: 100%; padding: 10px; border-radius: 40px" />
          <button class="btn-primary" onclick="saveCloudSettings()">حفظ</button>
          <p id="cloudMsg"></p>
        </div>
      </div>
    </div>
    <div id="detailModal" class="modal"><div class="modal-content" id="modalContent"></div></div>
    <div id="previewModal" class="modal">
      <div class="modal-content" id="previewContent" style="width: 900px; max-width: 95%"></div>
    </div>

    <script>
      // ---------- IndexedDB ----------
      const db = new Dexie("AdminPlatformFinal");
      db.version(1).stores({
        documents:
          "++id, title, type, unit, year, cloudUrl, content, fileBase64, fileType, syncStatus, tags, createdAt, updatedAt, versionHistory, comments, lastSynced",
        procedures:
          "++id, title, type, unit, cloudUrl, content, fileBase64, fileType, syncStatus, tags, createdAt, updatedAt, versionHistory, comments, searchCount, editCount, lastSynced",
        operationalGuides:
          "++id, title, category, unit, cloudUrl, content, fileBase64, fileType, syncStatus, tags, createdAt, updatedAt, versionHistory, comments, lastSynced",
        tasks:
          "++id, title, assignedTo, assignedBy, dueDate, status, description, fileBase64, fileType, cloudUrl, syncStatus, createdAt, updatedAt, comments, lastSynced",
        adminOrders:
          "++id, title, employeeName, orderDescription, startDate, endDate, issuedBy, fileBase64, fileType, cloudUrl, syncStatus, createdAt, updatedAt, comments, tags, archiveYear, lastSynced",
        auditLog: "++id, userId, action, targetType, targetId, details, timestamp",
        notes: "++id, user, text, date",
        cloudSettings: "id, baseUrl",
      });
      let currentUser = "";

      // دوال مساعدة
      async function logAction(action, targetType, targetId, details) {
        await db.auditLog.add({
          userId: currentUser,
          action,
          targetType,
          targetId,
          details,
          timestamp: new Date().toISOString(),
        });
      }
      function detectFileType(fileName, mimeType) {
        if (!fileName && !mimeType) return "other";
        const ext = fileName.split(".").pop().toLowerCase();
        if (mimeType?.startsWith("image/")) return "image";
        if (mimeType === "application/pdf") return "pdf";
        if (mimeType?.includes("word")) return "word";
        if (mimeType?.includes("sheet")) return "excel";
        if (mimeType?.includes("text")) return "text";
        if (["jpg", "png", "gif", "webp"].includes(ext)) return "image";
        if (ext === "pdf") return "pdf";
        if (["doc", "docx"].includes(ext)) return "word";
        if (["xls", "xlsx", "csv"].includes(ext)) return "excel";
        if (["mp4", "webm", "avi"].includes(ext)) return "video";
        if (["mp3", "wav"].includes(ext)) return "audio";
        if (ext === "txt") return "text";
        return "other";
      }
      function getFileIcon(type) {
        const map = {
          image: "🖼️",
          pdf: "📄",
          word: "📝",
          excel: "📊",
          video: "🎥",
          audio: "🎵",
          text: "📃",
          other: "📁",
        };
        return map[type] || "📁";
      }
      async function generateCloudUrl(item, type) {
        let settings = await db.cloudSettings.get(1);
        let base = settings?.baseUrl || "https://university.sharepoint.com";
        return `${base}/${type}/${item.id}_${Date.now()}`;
      }

      // معاينة الملفات
      async function previewFile(fileBase64, fileType, fileName) {
        if (!fileBase64) {
          alert("لا يوجد ملف مرفق لعرضه.");
          return;
        }
        let previewModal = document.getElementById("previewModal");
        let previewContent = document.getElementById("previewContent");
        previewContent.innerHTML = `<h4>📄 استعراض الملف: ${fileName || "ملف"}</h4><div id="previewArea" class="preview-container">جاري التحميل...</div><button class="btn-primary" onclick="closePreviewModal()">إغلاق</button>`;
        previewModal.style.display = "flex";
        let previewArea = document.getElementById("previewArea");
        try {
          if (fileType === "image")
            previewArea.innerHTML = `<img src="${fileBase64}" style="max-width:100%; max-height:500px; border-radius:12px;">`;
          else if (fileType === "pdf")
            previewArea.innerHTML = `<iframe src="${fileBase64}" style="width:100%; height:600px; border:none;"></iframe>`;
          else if (fileType === "excel") {
            let binary = atob(fileBase64.split(",")[1]);
            let wb = XLSX.read(binary, { type: "binary" });
            let sheet = wb.Sheets[wb.SheetNames[0]];
            let html = XLSX.utils.sheet_to_html(sheet, { editable: false });
            previewArea.innerHTML = `<div style="overflow-x:auto;">${html}</div>`;
          } else if (fileType === "word")
            previewArea.innerHTML = `<p>لا يمكن عرض ملفات Word مباشرة. <a href="${fileBase64}" download>تحميل الملف</a></p>`;
          else if (fileType === "text") {
            let text = atob(fileBase64.split(",")[1]);
            previewArea.innerHTML = `<pre style="white-space:pre-wrap; background:#f1f5f9; padding:12px; border-radius:12px;">${DOMPurify.sanitize(text)}</pre>`;
          } else if (fileType === "video")
            previewArea.innerHTML = `<video controls style="max-width:100%; max-height:500px;"><source src="${fileBase64}" type="video/mp4"></video>`;
          else if (fileType === "audio")
            previewArea.innerHTML = `<audio controls style="width:100%;"><source src="${fileBase64}"></audio>`;
          else previewArea.innerHTML = `<p>لا توجد معاينة متاحة. <a href="${fileBase64}" download>تحميل الملف</a></p>`;
        } catch (e) {
          previewArea.innerHTML = `<p>خطأ في العرض: ${e.message}</p>`;
        }
      }
      function closePreviewModal() {
        document.getElementById("previewModal").style.display = "none";
      }

      // تحميل البيانات الأولية
      async function loadInitialData() {
        await db.cloudSettings.put({ id: 1, baseUrl: "https://university.sharepoint.com/sites/GrantManagement" });
        let notes = await db.notes.toArray();
        if (notes.length === 0)
          await db.notes.add({ user: "النظام", text: "منصة جاهزة", date: new Date().toLocaleString() });
        let docs = await db.documents.toArray();
        if (docs.length === 0)
          await db.documents.add({
            title: "لائحة المنح",
            type: "لائحة",
            unit: "المنح",
            year: "2026",
            content: "نص اللائحة",
            syncStatus: "synced",
            tags: ["منح"],
            fileType: "text",
            versionHistory: [],
            comments: [],
            lastSynced: new Date(),
          });
        let procs = await db.procedures.toArray();
        if (procs.length === 0)
          await db.procedures.add({
            title: "دليل الإجراءات",
            type: "إجرائي",
            unit: "الجودة",
            content: "خطوات العمل",
            syncStatus: "synced",
            tags: ["رئيسي"],
            fileType: "text",
            versionHistory: [],
            comments: [],
            searchCount: 0,
            editCount: 0,
          });
        let opGuides = await db.operationalGuides.toArray();
        if (opGuides.length === 0)
          await db.operationalGuides.add({
            title: "دليل التشغيل اليومي",
            category: "تشغيلي",
            unit: "التشغيل",
            content: "إرشادات",
            syncStatus: "synced",
            tags: ["تشغيل"],
            fileType: "text",
            versionHistory: [],
            comments: [],
          });
        let tasks = await db.tasks.toArray();
        if (tasks.length === 0)
          await db.tasks.add({
            title: "مراجعة الطلبات",
            assignedTo: "أ. نوف",
            assignedBy: "مدير الإدارة",
            dueDate: "2026-06-01",
            status: "معلقة",
            description: "مراجعة 30 طلباً",
            fileBase64: "",
            fileType: "",
            cloudUrl: "",
            syncStatus: "pending",
          });
        let orders = await db.adminOrders.toArray();
        if (orders.length === 0)
          await db.adminOrders.add({
            title: "إعداد التقرير السنوي",
            employeeName: "أ. نوف جمبي",
            orderDescription: "إعداد التقرير النهائي",
            startDate: "2026-05-01",
            endDate: "2026-05-30",
            issuedBy: "مدير الإدارة",
            fileBase64: "",
            fileType: "pdf",
            cloudUrl: "",
            syncStatus: "pending",
            archiveYear: "2026",
            tags: ["تقارير"],
            comments: [],
          });
        await refreshDashboards();
        await renderDocumentsTable();
        await renderProceduresTable();
        await renderOperationalGuidesTable();
        await renderTasksTable();
        await renderAdminOrdersTable();
        await generateRecommendations();
      }

      async function refreshDashboards() {
        let docs = await db.documents.toArray();
        let tasks = await db.tasks.toArray();
        let orders = await db.adminOrders.toArray();

      async function generateRecommendations() {
        let procs = await db.procedures.toArray();
        let recs = procs
          .filter((p) => (p.searchCount || 0) + (p.editCount || 0) > 2)
          .map((p) => ({ procedureId: p.id, suggestion: `الدليل "${p.title}" يحتاج تحديث` }));
        let box = document.getElementById("recommendationsBox");
        if (box)
          box.innerHTML =
            `<strong>💡 توصيات ذكية</strong><br/>` +
            (recs.length ? recs.map((r) => `• ${r.suggestion}`).join("<br/>") : "لا توجد توصيات");
      }

      }

      async function renderGenericTable(storeName, tableId) {
        let items = await db[storeName].toArray();
        let html = `<table><thead><tr><th>ID</th><th>العنوان</th><th>التفاصيل</th><th>نوع الملف</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>`;
        for (let item of items) {
          let title = item.title || item.orderDescription || "";
          let details = "";
          if (storeName === "documents") details = `${item.type} | ${item.unit} | ${item.year}`;
          else if (storeName === "procedures") details = `${item.type} | ${item.unit}`;
          else if (storeName === "operationalGuides") details = `${item.category} | ${item.unit}`;
          else if (storeName === "tasks") details = `إلى: ${item.assignedTo} | ${item.dueDate} | ${item.status}`;
          else if (storeName === "adminOrders")
            details = `الموظف: ${item.employeeName} | ${item.startDate} → ${item.endDate}`;
          let syncClass = item.syncStatus === "synced" ? "sync-success" : "sync-pending";
          html += `<tr>
        <td>${item.id}</td>
        <td>${title}</td>
        <td>${details}</td>
        <td><span class="file-icon">${getFileIcon(item.fileType)}</span> ${item.fileType || "نص"}</td>
        <td><span class="sync-status ${syncClass}">${item.syncStatus || "غير متزامن"}</span></td>
        <td>
          <button class="btn-primary" onclick="openEditModal('${storeName}', ${item.id})">✏️ تحرير</button>
          ${item.fileBase64 ? `<button class="btn-primary" onclick="previewFile('${item.fileBase64}', '${item.fileType}', '${title}')">👁️ عرض</button>` : ""}
          <button class="btn-primary" onclick="syncItem('${storeName}', ${item.id})">🔄 مزامنة</button>
        </td>
      </tr>`;
        }
        html += `</tbody></table>`;
        document.getElementById(tableId).innerHTML = html;
      }

        } else if (storeName === "operationalGuides") {

        <div><label>الفئة:</label> <input id="editCategory" value="${item.category || ""}" style="width:100%"></div>

      `;
        } else if (storeName === "tasks") {

          fieldsHtml = `
        <div><label>العنوان:</label> <input id="editTitle" value="${item.title || ""}" style="width:100%"></div>
        <div><label>اسم الموظف:</label> <input id="editEmployee" value="${item.employeeName || ""}" style="width:100%"></div>

        <div><label>تاريخ الانتهاء:</label> <input type="date" id="editEndDate" value="${item.endDate || ""}" style="width:100%"></div>
        <div><label>الوصف الإضافي:</label> <textarea id="editContent" rows="5" style="width:100%">${item.description || ""}</textarea></div>
      `;
        }
        modal.querySelector("#modalContent").innerHTML = `
      <h4>✏️ تحرير: ${item.title || item.orderDescription}</h4>
      ${fieldsHtml}
      <div><label>رفع ملف من جهازك (PDF، صورة، Excel، Word، صوت، فيديو):</label> <input type="file" id="uploadFile" accept=".pdf,.jpg,.png,.doc,.docx,.xls,.xlsx,.mp4,.mp3,.txt"></div>
      <div id="previewArea"></div>
      <div style="margin-top:15px;"><label>اسم الملف المرفق الحالي:</label> <span id="currentFileName">${item.fileBase64 ? "ملف مرفق" : "لا يوجد ملف"}</span></div>

        modal.style.display = "flex";
        if (item.fileBase64) {

          if (item.fileType === "image")
            previewDiv.innerHTML = `<img src="${item.fileBase64}" style="max-width:100%; max-height:200px;">`;

            previewDiv.innerHTML = `<a href="${item.fileBase64}" target="_blank">📄 معاينة PDF</a>`;
          else previewDiv.innerHTML = `<a href="${item.fileBase64}" download>⬇️ تحميل الملف الحالي</a>`;
        }
        // رفع ملف جديد
        document.getElementById("uploadFile").onchange = async (e) => {
          let file = e.target.files[0];
          if (!file) return;
          let reader = new FileReader();
          reader.onload = async (ev) => {
            let base64 = ev.target.result;
            let fileType = detectFileType(file.name, file.type);
            // تخزين الملف في كائن مؤقت لحين الحفظ
            window.tempFileBase64 = base64;
            window.tempFileType = fileType;
            window.tempFileName = file.name;
            document.getElementById("currentFileName").innerHTML = `سيتم رفع: ${file.name} (${fileType})`;
            let previewDiv = document.getElementById("previewArea");
            if (fileType === "image")
              previewDiv.innerHTML = `<img src="${base64}" style="max-width:100%; max-height:200px;">`;
            else if (fileType === "pdf") previewDiv.innerHTML = `<a href="${base64}" target="_blank">📄 معاينة PDF</a>`;
            else previewDiv.innerHTML = `<a href="${base64}" download>معاينة الملف الجديد</a>`;
          };
          reader.readAsDataURL(file);
        };
      }

      // حفظ التعديلات والملف المرفق
      async function saveEdit(storeName, id) {
        let updates = {};
        // جمع الحقول حسب نوع الكيان
        if (storeName === "documents") {
          updates.title = document.getElementById("editTitle")?.value;
          updates.type = document.getElementById("editType")?.value;
          updates.unit = document.getElementById("editUnit")?.value;
          updates.year = document.getElementById("editYear")?.value;
          updates.content = document.getElementById("editContent")?.value;
        } else if (storeName === "procedures") {
          updates.title = document.getElementById("editTitle")?.value;
          updates.type = document.getElementById("editType")?.value;
          updates.unit = document.getElementById("editUnit")?.value;
          updates.content = document.getElementById("editContent")?.value;
          updates.editCount = ((await db.procedures.get(id)).editCount || 0) + 1;
        } else if (storeName === "operationalGuides") {
          updates.title = document.getElementById("editTitle")?.value;
          updates.category = document.getElementById("editCategory")?.value;
          updates.unit = document.getElementById("editUnit")?.value;
          updates.content = document.getElementById("editContent")?.value;
        } else if (storeName === "tasks") {
          updates.title = document.getElementById("editTitle")?.value;
          updates.assignedTo = document.getElementById("editAssignedTo")?.value;
          updates.dueDate = document.getElementById("editDueDate")?.value;
          updates.status = document.getElementById("editStatus")?.value;
          updates.description = document.getElementById("editContent")?.value;
        } else if (storeName === "adminOrders") {
          updates.title = document.getElementById("editTitle")?.value;
          updates.employeeName = document.getElementById("editEmployee")?.value;
          updates.orderDescription = document.getElementById("editOrderDesc")?.value;
          updates.startDate = document.getElementById("editStartDate")?.value;
          updates.endDate = document.getElementById("editEndDate")?.value;
          updates.description = document.getElementById("editContent")?.value;
        }
        // إذا تم رفع ملف جديد، أضفه
        if (window.tempFileBase64) {
          updates.fileBase64 = window.tempFileBase64;
          updates.fileType = window.tempFileType;
          delete window.tempFileBase64;
          delete window.tempFileType;
        }
        updates.syncStatus = "pending";
        updates.updatedAt = new Date();
        await db[storeName].update(id, updates);
        // مزامنة تلقائية
        let cloudUrl = await generateCloudUrl(await db[storeName].get(id), storeName);
        await db[storeName].update(id, { cloudUrl, syncStatus: "synced", lastSynced: new Date() });
        await logAction("تعديل وحفظ", storeName, id, "تم التعديل وحفظ الملف");
        closeModal();
        // تحديث الجدول المعني
        if (storeName === "documents") renderDocumentsTable();
        else if (storeName === "procedures") {
          renderProceduresTable();
          generateRecommendations();
        } else if (storeName === "operationalGuides") renderOperationalGuidesTable();
        else if (storeName === "tasks") renderTasksTable();
        else if (storeName === "adminOrders") renderAdminOrdersTable();
        alert("✅ تم حفظ التعديلات والملف المرفق، ومزامنتها مع السحابة.");
      }

      // مزامنة يدوية
      async function syncItem(storeName, id) {
        let cloudUrl = await generateCloudUrl(await db[storeName].get(id), storeName);
        await db[storeName].update(id, { cloudUrl, syncStatus: "synced", lastSynced: new Date() });
        await logAction("مزامنة يدوية", storeName, id, `تمت المزامنة إلى ${cloudUrl}`);
        if (storeName === "documents") renderDocumentsTable();
        else if (storeName === "procedures") renderProceduresTable();
        else if (storeName === "operationalGuides") renderOperationalGuidesTable();
        else if (storeName === "tasks") renderTasksTable();
        else if (storeName === "adminOrders") renderAdminOrdersTable();
        alert("✅ تمت المزامنة مع السحابة.");
      }

      // البحث الذكي مع أزرار تحرير وعرض ومزامنة
      async function runSmartSearch() {
        let query = document.getElementById("smartQuery").value.toLowerCase();
        let type = document.getElementById("smartTypeFilter").value;
        let results = [];
        if (!type || type === "document")
          results.push(...(await db.documents.toArray()).map((d) => ({ ...d, category: "مستند", store: "documents" })));
        if (!type || type === "procedure")
          results.push(
            ...(await db.procedures.toArray()).map((p) => ({ ...p, category: "دليل إجرائي", store: "procedures" })),
          );
        if (!type || type === "opGuide")
          results.push(
            ...(await db.operationalGuides.toArray()).map((g) => ({
              ...g,
              category: "دليل تشغيلي",
              store: "operationalGuides",
            })),
          );
        if (!type || type === "task")
          results.push(...(await db.tasks.toArray()).map((t) => ({ ...t, category: "مهمة", store: "tasks" })));
        if (!type || type === "order")
          results.push(
            ...(await db.adminOrders.toArray()).map((o) => ({ ...o, category: "تكليف إداري", store: "adminOrders" })),
          );
        let filtered = results.filter((r) => JSON.stringify(r).toLowerCase().includes(query));
        let html = `<h4>نتائج البحث (${filtered.length})</h4>`;
        for (let r of filtered) {
          html += `<div style="border-bottom:1px solid #eee; margin:12px; padding:8px;">
        <strong>${r.title || r.orderDescription}</strong> (${r.category})<br>
        <small>${(r.content || r.description || r.orderDescription || "").substring(0, 100)}</small><br>
        <button class="btn-primary" onclick="openEditModal('${r.store}', ${r.id})">✏️ تحرير</button>
        ${r.fileBase64 ? `<button class="btn-primary" onclick="previewFile('${r.fileBase64}', '${r.fileType}', '${r.title}')">👁️ عرض</button>` : ""}
        <button class="btn-primary" onclick="syncItem('${r.store}', ${r.id})">🔄 مزامنة</button>
      </div>`;
        }
        document.getElementById("smartResults").innerHTML = html;
      }
